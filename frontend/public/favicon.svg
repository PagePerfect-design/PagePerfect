<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#FF3333"/>

  <!-- Golden rectangle outline -->
  <rect x="19" y="30.8" width="62" height="38.3" stroke="#FDFCF8" stroke-width="0.8" opacity="0.4"/>

  <!-- Registration crosshair -->
  <line x1="50" y1="38" x2="50" y2="62" stroke="#FDFCF8" stroke-width="1.4" opacity="0.9"/>
  <line x1="38" y1="50" x2="62" y2="50" stroke="#FDFCF8" stroke-width="1.4" opacity="0.9"/>
  <circle cx="50" cy="50" r="9" stroke="#FDFCF8" stroke-width="1" opacity="0.7"/>

  <!-- Baseline grid fragments — left -->
  <line x1="5" y1="45" x2="16" y2="45" stroke="#FDFCF8" stroke-width="0.5" opacity="0.25" stroke-dasharray="2 1.5"/>
  <line x1="5" y1="50" x2="16" y2="50" stroke="#FDFCF8" stroke-width="0.5" opacity="0.25" stroke-dasharray="2 1.5"/>
  <line x1="5" y1="55" x2="16" y2="55" stroke="#FDFCF8" stroke-width="0.5" opacity="0.25" stroke-dasharray="2 1.5"/>

  <!-- Baseline grid fragments — right -->
  <line x1="84" y1="45" x2="95" y2="45" stroke="#FDFCF8" stroke-width="0.5" opacity="0.25" stroke-dasharray="2 1.5"/>
  <line x1="84" y1="50" x2="95" y2="50" stroke="#FDFCF8" stroke-width="0.5" opacity="0.25" stroke-dasharray="2 1.5"/>
  <line x1="84" y1="55" x2="95" y2="55" stroke="#FDFCF8" stroke-width="0.5" opacity="0.25" stroke-dasharray="2 1.5"/>

  <!-- Corner crop marks -->
  <polyline points="8,18 8,10 16,10" stroke="#FDFCF8" stroke-width="0.8" opacity="0.35" fill="none"/>
  <polyline points="84,10 92,10 92,18" stroke="#FDFCF8" stroke-width="0.8" opacity="0.35" fill="none"/>
  <polyline points="8,82 8,90 16,90" stroke="#FDFCF8" stroke-width="0.8" opacity="0.35" fill="none"/>
  <polyline points="84,90 92,90 92,82" stroke="#FDFCF8" stroke-width="0.8" opacity="0.35" fill="none"/>

  <!-- φ indicator -->
  <text x="75" y="34" fill="#FDFCF8" font-size="6" font-family="Georgia, serif" font-style="italic" opacity="0.3">φ</text>
</svg>
