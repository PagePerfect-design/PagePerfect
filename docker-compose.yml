# PagePerfect — Local Development
# Usage: docker compose up
# Frontend: http://localhost:3000
# Backend:  http://localhost:4000

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    # Dev mode: mount source for live reload, override CMD
    volumes:
      - ./backend/index.js:/app/index.js
      - ./backend/routes:/app/routes
      - ./backend/templates:/app/templates:ro
      - ./backend/filters:/app/filters:ro
    command: ["node", "--watch", "index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security hardening (matches npm run docker:run)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1024m
      - /var/cache/fontconfig:rw,size=32m
    mem_limit: 1g
    pids_limit: 100

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:4000
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
